name: Release smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published immutable skills-manager release tag"
        required: true
        type: string

permissions: {}

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64 macOS 14
            runner: macos-14
            architecture: arm64
            os_major: "14"
            target: aarch64-apple-darwin
            deployment_target: "14.0"
          - name: ARM64 macOS 15
            runner: macos-15
            architecture: arm64
            os_major: "15"
            target: aarch64-apple-darwin
            deployment_target: "14.0"
          - name: ARM64 macOS 26
            runner: macos-26
            architecture: arm64
            os_major: "26"
            target: aarch64-apple-darwin
            deployment_target: "14.0"
          - name: Intel macOS 15
            runner: macos-15-intel
            architecture: x86_64
            os_major: "15"
            target: x86_64-apple-darwin
            deployment_target: "15.0"
          - name: Intel macOS 26
            runner: macos-26-intel
            architecture: x86_64
            os_major: "26"
            target: x86_64-apple-darwin
            deployment_target: "15.0"
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ARCHITECTURE: ${{ matrix.architecture }}
      OS_MAJOR: ${{ matrix.os_major }}
      TARGET: ${{ matrix.target }}
      DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - name: Validate runner architecture and OS
        run: |
          test "$(uname -m)" = "$ARCHITECTURE"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "$OS_MAJOR"

      - name: Download the immutable release archive
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          archive="skills-manager-$TAG-$TARGET.tar.gz"
          mkdir -p dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --dir dist

      - name: Validate and run the release binary
        run: |
          archive="dist/skills-manager-$TAG-$TARGET.tar.gz"
          package_dir="$(mktemp -d "${TMPDIR:-/tmp}/skills-manager-smoke.XXXXXX")"
          trap 'rm -rf "$package_dir"' EXIT

          tar -xzf "$archive" -C "$package_dir"
          actual_entries="$(find "$package_dir" -mindepth 1 -maxdepth 1 -exec basename {} \; | sort)"
          expected_entries="$(printf '%s\n' LICENSE README.md skills-manager)"
          test "$actual_entries" = "$expected_entries"

          binary="$package_dir/skills-manager"
          test -x "$binary"
          test "$(find "$package_dir" -maxdepth 1 -type f -perm -111 -exec basename {} \;)" = "skills-manager"
          test "$(lipo -archs "$binary")" = "$ARCHITECTURE"
          file -b "$binary" | grep -q "Mach-O 64-bit executable $ARCHITECTURE"

          deployment_target="$(otool -l "$binary" | awk '
            /LC_BUILD_VERSION/ { in_build=1; next }
            in_build && $1 == "minos" { print $2; exit }
            /LC_VERSION_MIN_MACOSX/ { in_min=1; next }
            in_min && $1 == "version" { print $2; exit }
          ')"
          test "$deployment_target" = "$DEPLOYMENT_TARGET"
          codesign --verify --strict --verbose=2 "$binary"
          codesign --display --verbose=4 "$binary" 2>&1 | grep -q '^Signature=adhoc$'
          test "$($binary --version)" = "skills-manager ${TAG#v}"
